<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict MPG</title>
</head>
<body>
    <h1>Predict Miles Per Gallon (MPG)</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Predict</button>
    </form>
    {% if prediction %}
        <h2>Predicted MPG: {{ prediction }}</h2>
    {% endif %}
</body>
</html>
